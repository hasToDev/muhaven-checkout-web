<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Redirecting — MuHaven Checkout</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      background: #121315;
      color: #f5e7c0;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      -webkit-font-smoothing: antialiased;
    }
    main {
      text-align: center;
      max-width: 480px;
      padding: 2rem;
    }
    .glyph {
      display: inline-grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(255, 186, 32, 0.12);
      box-shadow: 0 0 0 1px rgba(255, 186, 32, 0.3) inset;
      margin: 0 auto 1rem;
      color: #ffba20;
    }
    h1 {
      font-weight: 600;
      font-size: 1.125rem;
      margin: 0 0 .5rem;
      letter-spacing: -0.01em;
    }
    p {
      color: #c8b88a;
      margin: .25rem 0;
      font-size: .9rem;
      line-height: 1.5;
    }
    a {
      color: #ffba20;
      text-decoration: none;
      border-bottom: 1px solid rgba(255, 186, 32, 0.4);
    }
    code {
      font-family: "DM Mono", ui-monospace, SFMono-Regular, monospace;
      font-size: 0.85em;
      color: #f5e7c0;
    }
    .spin {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(200, 184, 138, 0.3);
      border-top-color: #c8b88a;
      border-radius: 50%;
      animation: r 0.8s linear infinite;
      vertical-align: -2px;
      margin-right: 6px;
    }
    @keyframes r { to { transform: rotate(360deg) } }
  </style>
</head>
<body>
  <main>
    <div class="glyph" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M13 5l7 7-7 7"/>
      </svg>
    </div>
    <h1>MuHaven Checkout has moved</h1>
    <p><span class="spin" aria-hidden="true"></span>Forwarding you to <code>muhaven.app/pay</code>…</p>
    <p style="margin-top: 1rem;"><a id="manual" href="https://muhaven.app/pay">Open the new checkout manually</a></p>
  </main>
  <script>
    (function () {
      // 2026-05-15 subdomain-collapse migration shim.
      //
      // Pre-migration checkout URLs were minted at
      //   https://pay.muhaven.app/c/<sessionId>#k=<base64url(32B)>
      // and may still be in flight (30-min default TTL). The new
      // origin is `muhaven.app/pay/`. Bouncing via
      // `window.location.replace` preserves the URL fragment
      // deterministically — `replace` runs AFTER the browser has
      // already parsed `location.hash`, so the AES-GCM key carried
      // in `#k=<base64url>` survives the redirect intact (unlike a
      // 301 which has historical fragment-loss inconsistencies on
      // cross-origin moves in Chrome/Safari).
      try {
        var path = window.location.pathname || '/';
        var hash = window.location.hash || '';
        var target = 'https://muhaven.app/pay' + path + hash;
        var manual = document.getElementById('manual');
        if (manual) manual.setAttribute('href', target);
        window.location.replace(target);
      } catch (_err) {
        // No-JS / privacy-extension blocks `replace` → user clicks
        // the fallback link instead.
      }
    })();
  </script>
</body>
</html>
